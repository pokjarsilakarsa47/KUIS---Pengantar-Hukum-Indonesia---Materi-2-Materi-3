<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>150 Soal Pengantar Hukum Indonesia — POK-JAR SILA KARSA</title>
<style>
:root{--maroon:#641f35;--paper:#f5f5f7;--ink:#20212a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink);line-height:1.5}
header{color:#fff;padding:28px 18px 24px;background:linear-gradient(120deg,#f28c28 0%,#9b4a4b 42%,#641f35 66%,#aeb1b8 100%);border-bottom:5px solid #d2d3d7}
.head{max-width:1000px;margin:auto}.headrow{display:flex;align-items:center;gap:22px}.logo{width:118px;height:118px;object-fit:cover;border-radius:50%;border:3px solid #f5d34f;background:#08284b;flex-shrink:0}.headtext{min-width:0}.eyebrow{font-size:.82rem;letter-spacing:.16em;font-weight:700;text-transform:uppercase}.brand{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;margin:.25rem 0}.subtitle{margin:0}
main{max-width:1000px;margin:22px auto;padding:0 14px 40px}.panel{background:#fff;border:1px solid #dedee3;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 16px #2221}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls select,.controls button{font:inherit;padding:10px 13px;border-radius:9px;border:1px solid #c9c9d0;background:white;color:var(--ink)}
button{cursor:pointer}.primary{background:var(--maroon)!important;color:white!important;border-color:var(--maroon)!important}.secondary{background:#ededf0!important}.stat b{display:block;font-size:1.3rem}

.kicker{color:#6b6b73;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.question{font-size:1.16rem;font-weight:700;margin:8px 0 16px}
.option{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid #dedee3;border-radius:10px;margin:9px 0;cursor:pointer;background:#fff}.option:hover{border-color:#8a455a;background:#fff9fa}.option input{margin-top:5px;accent-color:#641f35}.option.correct{border:2px solid #168348;background:#d9f8e5;color:#105b32}.option.wrong{border:2px solid #c62838;background:#ffe0e3;color:#8f1522}
.feedback{margin-top:14px;padding:12px;border-radius:10px;background:#f1f1f4;white-space:pre-line}.feedback.correct-feedback{border:2px solid #168348;background:#d9f8e5;color:#105b32;font-weight:600}.feedback.wrong-feedback{border:2px solid #c62838;background:#ffe0e3;color:#8f1522;font-weight:600}.hidden{display:none!important}.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}.nav button{padding:11px 16px;border-radius:9px;border:1px solid #d2d2d8}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#f8e6d4;color:#713b14;font-size:.8rem;font-weight:700}
footer{text-align:center;color:#6d6d75;font-size:.85rem;padding:12px}
@media(max-width:600px){.headrow{gap:12px}.logo{width:76px;height:76px}.stats{grid-template-columns:1fr 1fr}.panel{padding:14px}.question{font-size:1.05rem}.brand{font-size:1.55rem}}

.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
.result-card{border-radius:14px;padding:16px;border:1px solid #ddd;box-shadow:0 3px 10px #2221;background:#fff;min-width:0}
.result-card .label{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#62626b}
.result-card .number{font-size:1.8rem;font-weight:800;line-height:1.2;margin:7px 0}
.result-card .detail{font-size:.9rem;color:#555}
.result-card.score{background:#fff3e5;border-color:#f0a34a}
.result-card.good{background:#e7f8ee;border-color:#56b77b}
.result-card.bad{background:#fff0f1;border-color:#df7780}
.result-card.neutral{background:#eef3fb;border-color:#9bb8e6}
.result-section{border:1px solid #dedee3;border-radius:14px;padding:14px;margin:14px 0;background:#fff}
.result-section h3{margin:0 0 10px;font-size:1.05rem}
.answer-item{border:1px solid #dedee3;border-radius:10px;padding:12px;margin:8px 0;background:#fafafa}
.answer-item.good{border-left:5px solid #168348;background:#f0fff5}
.answer-item.bad{border-left:5px solid #c62838;background:#fff5f5}
.answer-item.unanswered{border-left:5px solid #8a8a94;background:#f6f6f8}
.answer-item .qtitle{font-weight:700;margin-bottom:5px}
.answer-item .answer-line{font-size:.93rem;margin-top:3px}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:650px){.result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.result-card .number{font-size:1.5rem}}
@media(max-width:420px){.result-grid{grid-template-columns:1fr}}

</style></head>

let active=[],index=0,answers={},checked={},mode='practice';
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setup(reshuffle=true){const cat=$('category').value;mode=$('mode').value;active=BANK.filter(q=>cat==='all'||String(q.category)===cat);active=shuffle(active);index=0;answers={};checked={};$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){if(!active.length)return;const q=active[index];$('position').textContent=`Soal ${index+1} dari ${active.length}`;$('topic').textContent=`Materi ${q.category} — ${q.topic}`;$('question').textContent=q.q;$('options').innerHTML='';
q.options.forEach((opt,i)=>{const label=document.createElement('label');label.className='option';const radio=document.createElement('input');radio.type='radio';radio.name='answer';radio.value=i;radio.checked=answers[q.id]===i;radio.addEventListener('change',()=>{if(checked[q.id])return;answers[q.id]=i;updateStats();if(mode==='practice'){checked[q.id]=true;showFeedback(q);$('options').querySelectorAll('input[type=radio]').forEach(el=>el.disabled=true)} });const span=document.createElement('span');span.textContent=String.fromCharCode(65+i)+'. '+opt;label.append(radio,span);$('options').append(label)});
$('feedback').classList.add('hidden');$('feedback').textContent='';if(checked[q.id]){showFeedback(q);if(mode==='practice')$('options').querySelectorAll('input[type=radio]').forEach(el=>el.disabled=true)}$('prev').disabled=index===0;$('next').disabled=index===active.length-1;$('check').textContent='Akhiri Kuis dan Lihat Hasil';updateStats()}
function updateStats(){const done=Object.keys(answers).filter(id=>active.some(q=>q.id===Number(id))).length;const correct=active.filter(q=>answers[q.id]===q.answer).length;const totalEl=$('total'),answeredEl=$('answered'),scoreEl=$('score'),barEl=$('bar');if(totalEl)totalEl.textContent=active.length;if(answeredEl)answeredEl.textContent=done;if(scoreEl)scoreEl.textContent=done?`${Math.round(correct/Math.max(1,active.length)*100)}%`:'—';if(barEl)barEl.style.width=(done/Math.max(1,active.length)*100)+'%'}
function showFeedback(q){const fb=$('feedback');fb.classList.remove('hidden','correct-feedback','wrong-feedback');const chosen=answers[q.id];if(chosen===undefined){fb.textContent=`Belum dijawab.\nJawaban benar: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`;}else if(chosen===q.answer){fb.classList.add('correct-feedback');fb.textContent='Benar. Jawaban Anda tepat.';}else{fb.classList.add('wrong-feedback');fb.textContent=`Belum tepat.\nJawaban benar: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`;}$('options').querySelectorAll('.option').forEach((el,i)=>{el.classList.toggle('correct',i===q.answer);el.classList.toggle('wrong',chosen===i&&chosen!==q.answer)})}
$('start').onclick=()=>setup(true);$('restartAfterResult').onclick=()=>{ $('result').classList.add('hidden'); $('quiz').classList.remove('hidden'); setup(true); $('quiz').scrollIntoView({behavior:'smooth',block:'start'}); };$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<active.length-1){index++;render()}};
$('check').onclick=(event)=>{
 event.preventDefault();
 const answered=active.filter(item=>answers[item.id]!==undefined);
 const unanswered=active.filter(item=>answers[item.id]===undefined);
 const correctItems=answered.filter(item=>answers[item.id]===item.answer);
 const wrongItems=answered.filter(item=>answers[item.id]!==item.answer);
 const score=active.length ? Math.round(correctItems.length/active.length*100) : 0;
 active.forEach(item=>{checked[item.id]=true});
 const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 $('resultText').innerHTML=`
 <p>Kuis telah berakhir. Berikut ringkasan hasil pengerjaan Anda.</p>
 <div class="result-grid">
  <div class="result-card score"><div class="label">Score / Nilai Akhir</div><div class="number">${score}/100</div><div class="detail">${correctItems.length} dari ${active.length} soal benar</div></div>
  <div class="result-card neutral"><div class="label">Soal Dijawab</div><div class="number">${answered.length}</div><div class="detail">dari ${active.length} soal</div></div>
  <div class="result-card"><div class="label">Belum Dijawab</div><div class="number">${unanswered.length}</div><div class="detail">soal dilewati</div></div>
  <div class="result-card good"><div class="label">Jawaban Benar</div><div class="number">${correctItems.length}</div><div class="detail">${active.length ? Math.round(correctItems.length/active.length*100) : 0}% dari seluruh soal</div></div>
  <div class="result-card bad"><div class="label">Jawaban Salah</div><div class="number">${wrongItems.length}</div><div class="detail">${answered.length ? Math.round(wrongItems.length/answered.length*100) : 0}% dari soal terjawab</div></div>
  <div class="result-card"><div class="label">Total Soal</div><div class="number">${active.length}</div><div class="detail">sesuai kategori yang dipilih</div></div>
 </div>`;
 const makeItems=(items,status)=>items.length ? items.map((item,n)=>{
   const selected=answers[item.id];
   const selectedText=selected===undefined?'Belum dijawab':`${String.fromCharCode(65+selected)}. ${item.options[selected]}`;
   const correctText=`${String.fromCharCode(65+item.answer)}. ${item.options[item.answer]}`;
   return `<div class="answer-item ${status}"><div class="qtitle">${n+1}. ${esc(item.q)}</div><div class="answer-line"><b>Jawaban Anda:</b> ${esc(selectedText)}</div><div class="answer-line"><b>Jawaban benar:</b> ${esc(correctText)}</div></div>`;
 }).join('') : '<p>Tidak ada soal dalam bagian ini.</p>';
 $('resultDetails').innerHTML=`
 <div class="result-section"><h3>Jawaban Salah (${wrongItems.length})</h3>${makeItems(wrongItems,'bad')}</div>
 <div class="result-section"><h3>Jawaban Benar (${correctItems.length})</h3>${makeItems(correctItems,'good')}</div>
 <div class="result-section"><h3>Soal Belum Dijawab (${unanswered.length})</h3>${makeItems(unanswered,'unanswered')}</div>`;
 $('result').classList.remove('hidden');
 $('quiz').classList.add('hidden');
 $('result').scrollIntoView({behavior:'smooth',block:'start'});
};
$('review').onclick=()=>{index=0;mode='practice';$('mode').value='practice';render();$('quiz').scrollIntoView({behavior:'smooth'})};setup(true);
</script></body></html>
